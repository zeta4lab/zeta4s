[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeta4s-cli"
dynamic = ["version"]
description = "Host CLI entrypoint for zeta4s"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "zeta4s[cli]",
]

[tool.setuptools]
package-dir = {"" = "../../src"}
packages = []

[tool.setuptools.dynamic]
version = {attr = "zeta4s.__version__"}

[project.scripts]
z4s = "zeta4s.cli.main:main"
