[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeta4s-api"
dynamic = ["version"]
description = "API and adapter entrypoint for zeta4s"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "prefect==3.8.7",
  "zeta4s[api]",
]

[tool.setuptools]
package-dir = {"" = "../../src"}
packages = []

[tool.setuptools.dynamic]
version = {attr = "zeta4s.__version__"}

[project.scripts]
zeta4s-api = "zeta4s.api.app:main"
