# zeta4s 는 자기 배포 단위만 덮는다.
#
# default deny 를 namespace 전체(`podSelector: {}`)에 걸면 zeta4s 가 배포하지 않는
# workload — Airflow, Prefect — 의 egress 까지 이 정책이 결정한다. 그 workload 가
# 무엇에 나가야 하는지는 그 배포가 알고 zeta4s 는 모른다. 반쯤 아는 채로 막으면
# scheduler 는 자기 backend 에 닿지 못한 채 조용히 멈춘다.
#
# NetworkPolicy 는 한 Pod 를 selector 로 고르는 순간 그 방향을 화이트리스트로 바꾼다.
# 그래서 "scheduler 에게 zeta4s-api 를 열어 준다" 는 정책은 실제로는 "scheduler 의
# 나머지 egress 를 모두 닫는다" 가 된다. zeta4s 는 scheduler Pod 를 egress 정책의
# selector 로 삼지 않는다.
#
# scheduler 가 internal API 로 들어오는 것은 ingress 쪽에서 label 로 식별한다.
# `zeta4s.io/runtime: scheduler` 는 그 식별용 표식이며 egress 를 열지 않는다.
# scheduler Pod 의 egress 는 그 배포가 소유한다 — namespace 전체 default deny 를
# 두려면 engine 이 필요로 하는 egress 와 `zeta4s-api:8088` 을 함께 열어야 한다.
# `README.md` 의 scheduler 배선 절이 그 경계를 설명한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeta4s-default-deny
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
spec:
  # zeta4s 소유 Pod 만 덮는다. namespace 안의 다른 workload 는 그 배포가 책임진다.
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: zeta4s
  policyTypes: ["Ingress", "Egress"]
---
# scheduler runtime Pod 만 internal execution endpoint 로 들어온다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeta4s-api-ingress
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zeta4s-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # 같은 namespace 의 scheduler Pod
        - podSelector:
            matchLabels:
              zeta4s.io/runtime: scheduler
        # 다른 namespace 에 둔 scheduler
        - namespaceSelector:
            matchLabels:
              zeta4s.io/scheduler: "true"
      ports:
        - protocol: TCP
          port: 8088
---
# zeta4s-api 는 metastore, scheduler REST, Iceberg catalog 와 object storage, 외부 data
# backend 로 나간다.
#
# Iceberg 는 두 목적지를 갖는다. catalog(REST) 로 table metadata 를 다루고, 실제 data file
# 은 catalog 가 vended credential 과 함께 알려 주는 object storage endpoint 로 직접 읽고
# 쓴다. catalog 만 열면 bootstrap 은 통과하지만 rowset 쓰기가 실패한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeta4s-api-egress
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zeta4s-api
  policyTypes: ["Egress"]
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # cluster 안의 metastore, Airflow REST, Prefect API, Iceberg catalog, object storage,
    # data backend
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 4200
        # Iceberg REST catalog (Lakekeeper 기본 포트)
        - protocol: TCP
          port: 8181
        - protocol: TCP
          port: 8123
        # ClickHouse native 와 S3 호환 object storage(MinIO, RustFS 등)가 함께 쓴다
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 1521
        - protocol: TCP
          port: 9200
    # cluster 밖의 data backend, Iceberg catalog, object storage.
    #
    # namespaceSelector 는 Pod 만 고르므로 외부 IP 는 위 규칙으로 열리지 않는다.
    # 운영 환경의 backend 가 cluster 밖에 있으면 그 CIDR 을 여기 적는다. 아래는
    # 예시이며 그대로 쓰지 않는다 — 필요한 대역만 남긴다. object storage 가 HTTPS
    # endpoint(예: 클라우드 S3, 443)라면 그 대역과 포트를 별도 규칙으로 더한다.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
            except:
              - 10.42.0.0/16 # k3s 기본 Pod CIDR. cluster 내부는 위 규칙이 담당한다
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8181
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 1521
        - protocol: TCP
          port: 9200
