# default deny 로 시작해 필요한 것만 연다.
#
# scheduler(Airflow, Prefect worker) 는 이 namespace 안에 둘 수도, 밖에 둘 수도 있다.
# 어느 쪽이든 다음 두 가지가 함께 있어야 internal API 호출이 성립한다.
#
#   1. zeta4s-api 로 들어오는 ingress 허용
#   2. scheduler Pod 에서 나가는 egress 허용 (default deny 가 Egress 에도 걸린다)
#
# 안에 두는 경우 Pod 에 `zeta4s.io/runtime: scheduler` label 을 붙인다.
# 밖에 두는 경우 그 namespace 에 `zeta4s.io/scheduler: "true"` label 을 붙이고
# 그쪽 namespace 에도 egress 정책을 둔다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeta4s-default-deny
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# scheduler runtime Pod 만 internal execution endpoint 로 들어온다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeta4s-api-ingress
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zeta4s-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # 같은 namespace 의 scheduler Pod
        - podSelector:
            matchLabels:
              zeta4s.io/runtime: scheduler
        # 다른 namespace 에 둔 scheduler
        - namespaceSelector:
            matchLabels:
              zeta4s.io/scheduler: "true"
      ports:
        - protocol: TCP
          port: 8088
---
# 같은 namespace 에 둔 scheduler 가 zeta4s-api 로 나갈 수 있어야 한다.
# default deny 가 Egress 에도 걸리므로 이 정책이 없으면 DAG task 가 internal API 를
# 호출하지 못한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeta4s-scheduler-egress
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
spec:
  podSelector:
    matchLabels:
      zeta4s.io/runtime: scheduler
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zeta4s-api
      ports:
        - protocol: TCP
          port: 8088
---
# zeta4s-api 는 metastore, scheduler REST, 외부 data backend 로 나간다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeta4s-api-egress
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zeta4s-api
  policyTypes: ["Egress"]
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # cluster 안의 metastore, Airflow REST, Prefect API, data backend
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 4200
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 1521
        - protocol: TCP
          port: 9200
    # cluster 밖의 data backend.
    #
    # namespaceSelector 는 Pod 만 고르므로 외부 IP 는 위 규칙으로 열리지 않는다.
    # 운영 환경의 backend 가 cluster 밖에 있으면 그 CIDR 을 여기 적는다. 아래는
    # 예시이며 그대로 쓰지 않는다 — 필요한 대역만 남긴다.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
            except:
              - 10.42.0.0/16 # k3s 기본 Pod CIDR. cluster 내부는 위 규칙이 담당한다
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 1521
        - protocol: TCP
          port: 9200
