# zeta4s-api 만 master keyring Secret 을 읽는다.
#
# Role 에 list 를 주지 않는다. list 는 namespace 의 다른 Secret 이름을 드러낸다.
# resourceNames 로 대상을 하나로 못박는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeta4s-api
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeta4s-api-master-keyring-reader
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zeta4s-secret-master-keyring"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeta4s-api-master-keyring-reader
  namespace: zeta4s
  labels:
    app.kubernetes.io/part-of: zeta4s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zeta4s-api-master-keyring-reader
subjects:
  - kind: ServiceAccount
    name: zeta4s-api
    namespace: zeta4s
